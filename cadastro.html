<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoBH Locadora - Aluguel de Carros</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="auth.js"></script>
</head>
<body>

<nav id="toc"></nav>

<main>
  <header id="d1">
    <h1>Criar Conta</h1>
  </header>

  <section id="cadastro">
    <form id="form-cliente" class="grid-form">
      <fieldset>
        <legend>Informações Pessoais:</legend>
        Nome: <input type="text" name="nome" class="fw" required><br>
        RG: <input type="text" name="rg" class="fw" required><br>
        CPF: <input type="text" name="cpf" class="fw" required><br>
        Endereço: <input type="text" name="endereco" class="fw" required><br>
        Profissão: <input type="text" name="profissao" class="fw" required>
      </fieldset>
      <fieldset>
        <legend>Rendimentos (Máx 3):</legend>
        Empregador 1: <input type="text" name="emp1" class="fw">
        Valor 1: <input type="number" name="val1" class="fw" min="0" step="0.01"><br>
        Empregador 2: <input type="text" name="emp2" class="fw">
        Valor 2: <input type="number" name="val2" class="fw" min="0" step="0.01"><br>
        Empregador 3: <input type="text" name="emp3" class="fw">
        Valor 3: <input type="number" name="val3" class="fw" min="0" step="0.01">
      </fieldset>
      <div class="full">
        <button type="submit" class="btn btn-success">Criar conta</button>
        <a href="login.html" class="btn btn-link">Já tenho conta</a>
      </div>
    </form>
  </section>

  <footer>
    <p>AutoBH Locadora - Atendimento de segunda a sábado, das 8h às 18h</p>
    <p>Copyright GRS 2026 - Todos direitos reservados</p>
  </footer>
</main>

<script src="api.js"></script>
<script src="clientes.js"></script>
</body>
</html>
