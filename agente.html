<!DOCTYPE html>
<html lang="pt-br" data-acesso="agente">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoBH Locadora - Aluguel de Carros</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="auth.js"></script>
</head>
<body>

<nav id="toc"></nav>

<main>
  <header id="d1">
    <h1>Pedidos Recebidos</h1>
  </header>

  <section id="visao-agente">
    <h2>Avaliação de Pedidos</h2>
    <form id="form-agente" class="grid-form">
      <fieldset>
        <legend>Avaliando como: <span id="agente-info"></span></legend>
        Pedido: <select name="pedidoId" class="fw" required></select><br>
        Parecer:
        <select name="status" class="fw" required>
          <option>Parecer Positivo - Contrato Executado</option>
          <option>Parecer Negativo</option>
        </select><br>
        <label id="campo-contrato">Contrato de crédito: <input type="text" name="contratoCredito" class="fw" placeholder="Ex.: CR-2026-0001 (R$ 30.000)"></label>
      </fieldset>
      <div class="full">
        <button type="submit" class="btn btn-primary">Registrar Parecer</button>
      </div>
    </form>
  </section>

  <section id="listagem">
    <table border="1">
      <caption>Pedidos dos Seus Carros</caption>
      <thead><tr><th>ID</th><th>Cliente</th><th>Automóvel</th><th>Data</th><th>Status</th><th>Contrato</th><th>Ações</th></tr></thead>
      <tbody id="tb-pedidos"></tbody>
    </table>
  </section>

  <footer>
    <p>AutoBH Locadora - Atendimento de segunda a sábado, das 8h às 18h</p>
    <p>Copyright GRS 2026 - Todos direitos reservados</p>
  </footer>
</main>

<script src="api.js"></script>
<script src="util.js"></script>
<script src="agente.js"></script>
</body>
</html>
